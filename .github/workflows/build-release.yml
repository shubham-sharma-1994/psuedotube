# Workflow name
name: Flutter Release Builds
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
on:
  workflow_dispatch:
    inputs:
      targets:
        description: 'Which builds to run (all/android/linux/windows)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - android
          - linux
          - windows
  push:
    branches:
      - main
      - master
      - 'feature/**'
  pull_request:
    branches:
      - main
      - master

jobs:
  build_android:
    name: Android APKs (all ABIs + universal)
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.targets == 'all' || github.event.inputs.targets == 'android' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Get Flutter dependencies
        run: flutter pub get

      # Dev signing without requiring GitHub Secrets.
      # Prefer secrets when set; otherwise use android/dev-keystore.b64 + defaults.
      - name: Decode keystore
        run: |
          set -euo pipefail
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/noize.keystore
          elif [ -f android/dev-keystore.b64 ]; then
            echo "Using committed android/dev-keystore.b64 (dev only)"
            tr -d '\n\r ' < android/dev-keystore.b64 | base64 -d > android/noize.keystore
          else
            echo "::error::No keystore available"
            exit 1
          fi
          test -s android/noize.keystore

      - name: Create key.properties
        run: |
          set -euo pipefail
          SP='${{ secrets.KEY_STORE_PASSWORD }}'
          KP='${{ secrets.KEY_PASSWORD }}'
          KA='${{ secrets.KEY_ALIAS }}'
          [ -n "$SP" ] || SP='NoizeYtm2026!'
          [ -n "$KP" ] || KP='NoizeYtm2026!'
          [ -n "$KA" ] || KA='noize'
          {
            echo "storePassword=$SP"
            echo "keyPassword=$KP"
            echo "keyAlias=$KA"
            echo "storeFile=noize.keystore"
          } > android/key.properties
          echo "Signing with alias=$KA"

      # GITHUB_RUN_NUMBER always increases → Android allows install-over without uninstall
      - name: Build APKs (split per ABI + universal)
        run: |
          flutter build apk --release --split-per-abi \
            --build-number="${{ github.run_number }}" \
            --build-name="1.0.0+${{ github.run_number }}"

      - name: Generate SHA-256 checksums (Android)
        working-directory: build/app/outputs/flutter-apk
        run: |
          for f in app-*-release.apk app-release.apk; do
            [ -f "$f" ] && sha256sum "$f" > "$f.sha256"
          done
          ls -la

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: android-apks-release
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/flutter-apk/*.sha256
          if-no-files-found: error
          retention-days: 14

  build_linux:
    name: Linux release bundle
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.targets == 'all' || github.event.inputs.targets == 'linux' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly \
            libgstreamer-plugins-bad1.0-dev

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build Linux release
        run: flutter build linux --release --build-number="${{ github.run_number }}"

      - name: Archive and hash Linux bundle
        run: |
          tar -czf linux-release.tar.gz -C build/linux/x64/release bundle
          sha256sum linux-release.tar.gz > linux-release.tar.gz.sha256

      - name: Upload Linux bundle
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: |
            linux-release.tar.gz
            linux-release.tar.gz.sha256
          retention-days: 14

  build_windows:
    name: Windows release bundle
    runs-on: windows-latest
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.targets == 'all' || github.event.inputs.targets == 'windows' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Create MSIX package (test certificate)
        run: |
          echo y | dart run msix:create

      - name: Generate SHA-256 checksum (MSIX)
        shell: pwsh
        run: |
          $msix = "build\\windows\\x64\\runner\\Release\\Noize.msix"
          $hash = (Get-FileHash $msix -Algorithm SHA256).Hash
          "$hash  Noize.msix" | Out-File -Encoding utf8 "$msix.sha256"

      - name: Upload MSIX
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            build/windows/x64/runner/Release/Noize.msix
            build/windows/x64/runner/Release/Noize.msix.sha256
          retention-days: 14
