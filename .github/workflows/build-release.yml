name: Flutter Release Builds

# Manual only — never on PR or push/merge to main.
on:
  workflow_dispatch:
    inputs:
      targets:
        description: "Which builds to run"
        required: false
        default: android
        type: choice
        options:
          - all
          - android
          - linux
          - windows

permissions:
  contents: read
  actions: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build_android:
    name: Android APKs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: ${{ inputs.targets == 'all' || inputs.targets == 'android' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: yes | flutter doctor --android-licenses || true
      - run: flutter pub get
      - name: Decode keystore
        run: |
          set -euo pipefail
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/noize.keystore
          elif [ -f android/dev-keystore.b64 ]; then
            tr -d '\n\r ' < android/dev-keystore.b64 | base64 -d > android/noize.keystore
          else
            echo "::error::No keystore available"
            exit 1
          fi
          test -s android/noize.keystore
      - name: key.properties
        run: |
          set -euo pipefail
          SP='${{ secrets.KEY_STORE_PASSWORD }}'
          KP='${{ secrets.KEY_PASSWORD }}'
          KA='${{ secrets.KEY_ALIAS }}'
          [ -n "$SP" ] || SP='NoizeYtm2026!'
          [ -n "$KP" ] || KP='NoizeYtm2026!'
          [ -n "$KA" ] || KA='noize'
          {
            echo "storePassword=$SP"
            echo "keyPassword=$KP"
            echo "keyAlias=$KA"
            echo "storeFile=noize.keystore"
          } > android/key.properties
      - run: |
          flutter build apk --release --split-per-abi \
            --build-number="${{ github.run_number }}" \
            --build-name="1.0.0+${{ github.run_number }}"
      - name: Checksums
        working-directory: build/app/outputs/flutter-apk
        run: |
          for f in *.apk; do [ -f "$f" ] && sha256sum "$f" > "$f.sha256"; done
          ls -lah
      - uses: actions/upload-artifact@v4
        with:
          name: android-release-run${{ github.run_number }}
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/flutter-apk/*.sha256
          if-no-files-found: error
          retention-days: 30

  build_linux:
    name: Linux release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: ${{ inputs.targets == 'all' || inputs.targets == 'linux' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good libgstreamer-plugins-bad1.0-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build linux --release --build-number="${{ github.run_number }}"
      - run: |
          tar -czf linux-release.tar.gz -C build/linux/x64/release bundle
          sha256sum linux-release.tar.gz > linux-release.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: linux-release-run${{ github.run_number }}
          path: |
            linux-release.tar.gz
            linux-release.tar.gz.sha256
          retention-days: 30

  build_windows:
    name: Windows MSIX
    runs-on: windows-latest
    timeout-minutes: 60
    if: ${{ inputs.targets == 'all' || inputs.targets == 'windows' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: echo y | dart run msix:create
      - name: Hash MSIX
        shell: pwsh
        run: |
          $msix = "build\windows\x64\runner\Release\Noize.msix"
          if (Test-Path $msix) {
            $hash = (Get-FileHash $msix -Algorithm SHA256).Hash
            "$hash  Noize.msix" | Out-File -Encoding utf8 "$msix.sha256"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release-run${{ github.run_number }}
          path: |
            build/windows/x64/runner/Release/Noize.msix
            build/windows/x64/runner/Release/Noize.msix.sha256
          retention-days: 30
          if-no-files-found: warn
