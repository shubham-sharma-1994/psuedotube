name: PR Android CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  checks: write
  pull-requests: write

concurrency:
  group: pr-android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Build signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Decode keystore (secrets or baked dev keystore)
        run: |
          set -euo pipefail
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/noize.keystore
            echo "Using KEYSTORE_BASE64 secret"
          elif [ -f android/dev-keystore.b64 ]; then
            tr -d '\n\r ' < android/dev-keystore.b64 | base64 -d > android/noize.keystore
            echo "Using committed android/dev-keystore.b64"
          else
            echo "::error::No keystore (set KEYSTORE_BASE64 or commit android/dev-keystore.b64)"
            exit 1
          fi
          test -s android/noize.keystore

      - name: Write key.properties
        run: |
          set -euo pipefail
          SP='${{ secrets.KEY_STORE_PASSWORD }}'
          KP='${{ secrets.KEY_PASSWORD }}'
          KA='${{ secrets.KEY_ALIAS }}'
          [ -n "$SP" ] || SP='NoizeYtm2026!'
          [ -n "$KP" ] || KP='NoizeYtm2026!'
          [ -n "$KA" ] || KA='noize'
          {
            echo "storePassword=$SP"
            echo "keyPassword=$KP"
            echo "keyAlias=$KA"
            echo "storeFile=noize.keystore"
          } > android/key.properties
          echo "Signing alias=$KA"

      - name: Build release APK
        run: |
          flutter build apk --release --split-per-abi \
            --build-number="${{ github.run_number }}" \
            --build-name="1.0.0+${{ github.run_number }}"

      - name: Checksums
        working-directory: build/app/outputs/flutter-apk
        run: |
          for f in *.apk; do
            [ -f "$f" ] && sha256sum "$f" > "$f.sha256"
          done
          ls -lah

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-pr${{ github.event.pull_request.number || 0 }}-run${{ github.run_number }}
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/flutter-apk/*.sha256
          if-no-files-found: error
          retention-days: 14
