name: noize
description: "PsuedoTube – a free, privacy-first YouTube Music client."

publish_to: none

version: 1.0.0+2
license: GPL-3.0-or-later

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  audio_service: ^0.18.19
  audio_session: ^0.2.4
  audio_video_progress_bar: ^2.0.3
  media_kit: ^1.2.6
  media_kit_libs_android_audio: ^1.3.8
  media_kit_libs_ios_audio: ^1.1.4
  media_kit_libs_windows_audio: ^1.0.9
  media_kit_libs_linux: ^1.2.1
  sleek_circular_slider: ^2.1.0
  smtc_windows: ^1.1.0

  audio_metadata_reader: ^1.6.0
  dart_ytmusic_api: ^1.3.7
  jiosaavn: ^0.1.1
  metadata_god: ^1.1.0
  youtube_explode_dart:
    git:
      url: https://github.com/anandnet/youtube_explode_dart.git
      ref: 1d9ec9baa806705b1d859260eeb389ec28c6b024
  youtube_player_flutter: ^10.0.1
  flutter_inappwebview: ^6.1.5
  speech_to_text: ^7.4.0

  connectivity_plus: ^7.3.0
  dio: ^5.10.0

  hive_ce: ^2.19.3
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5

  go_router: ^17.1.0

  cached_network_image: ^3.4.1
  dynamic_color: ^1.8.1
  fl_chart: ^1.2.0
  flutter_animate: ^4.5.2
  flutter_markdown_plus: ^1.0.12
  flutter_svg: ^2.3.0
  google_fonts: ^8.2.0
  palette_generator: ^0.3.3+7
  persistent_bottom_nav_bar_v2: ^6.3.0
  shimmer: ^3.0.0
  flutter_native_splash: ^2.4.8
  easy_localization: ^3.0.8

  android_intent_plus: ^6.0.0
  android_package_installer: ^0.0.3
  device_info_plus: ^12.3.0
  duration_picker: ^1.2.0
  file_picker: ^11.0.2
  flutter_local_notifications: ^22.0.1
  package_info_plus: ^9.0.0
  permission_handler: ^12.0.3
  receive_sharing_intent:
    git:
      url: https://github.com/KasemJaffer/receive_sharing_intent
  share_plus: ^12.0.1
  terminate_restart: ^1.1.0
  url_launcher: ^6.3.2

  async: ^2.13.0
  collection: ^1.19.1
  crypto: ^3.0.7
  cupertino_icons: ^1.0.8
  get_it: ^9.2.1
  provider: ^6.1.5
  synchronized: ^3.4.0
  talker_flutter: ^5.1.16

dependency_overrides:
  go_router: ^16.3.0
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.13.1
  flutter_lints: ^6.0.0
  hive_ce_generator: ^1.9.3
  msix: ^3.16.12
  flutter_launcher_icons: ^0.14.3

msix_config:
  display_name: PsuedoTube
  publisher_display_name: Anand Kumar
  identity_name: com.psuedotube.app
  msix_version: 1.0.0.2
  logo_path: assets/images/psuedotube_logo.svg
  capabilities: internetClient,musicLibrary
  store: false

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/images/psuedotube_logo.png
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: assets/images/psuedotube_logo.png
  min_sdk_android: 24

flutter:
  uses-material-design: true

  assets:
    - assets/default_artwork.png
    - assets/images/psuedotube_logo.svg
    - assets/images/psuedotube_logo.png
    - assets/images/intro_ai_music.svg
    - assets/images/intro_discover.svg
    - assets/images/intro_download.svg
    - assets/translations/ar.json
    - assets/translations/bn.json
    - assets/translations/de.json
    - assets/translations/en.json
    - assets/translations/es.json
    - assets/translations/fr.json
    - assets/translations/gu.json
    - assets/translations/hi.json
    - assets/translations/id.json
    - assets/translations/ja.json
    - assets/translations/kn.json
    - assets/translations/ko.json
    - assets/translations/pt.json
    - assets/translations/mr.json
    - assets/translations/ru.json
    - assets/translations/ta.json
    - assets/translations/tr.json
    - assets/translations/te.json
    - assets/translations/uk.json
    - assets/translations/ur.json
    - assets/translations/vi.json
    - assets/translations/zh.json

flutter_native_splash:
  color: "#000000"
  image: assets/images/psuedotube_logo.png
  fullscreen: true
  android_12:
    color: "#000000"
    image: assets/images/psuedotube_logo.png
